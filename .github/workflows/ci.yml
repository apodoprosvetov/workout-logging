# FR-002/FR-003: every push/PR runs spec 001's Vitest/Supertest suites
# against real Postgres/MongoDB/Redis/RabbitMQ (not mocked, matching
# apps/api/tests/helpers/test-app.ts's own testing philosophy) and fails
# the run — and therefore blocks merge, once branch protection requires
# this check — on any test failure.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
   
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # FR-008: scans this push/PR's new commits for secrets (API keys,
      # passwords, etc.) and fails the run if it finds any — continuous
      # enforcement going forward, not a one-off. gitleaks-action v2+ uses
      # the Action context/GitHub API to scope the scan to just the
      # relevant commits, not the whole repo history on every run.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3

  compose-step:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # NestJS's ConfigModule (apps/api/src/app.module.ts, and the contract-
      # test harness) reads a literal .env file from disk — it doesn't exist
      # on a fresh checkout (.env is gitignored, only .env.example is
      # tracked). .env.example's values are already the docker-compose.yml
      # defaults, so this is a straight copy, no substitution needed.
      - name: Prepare env file
        run: cp .env.example .env

      # --wait blocks until every service's healthcheck (already defined in
      # docker-compose.yml) reports healthy, or fails the step if one never
      # does — without it, `up -d` returns as soon as containers start, and
      # the test step could hit Postgres/Mongo before they're accepting
      # connections yet.
      - name: Start containers
        run: |
          docker compose up -d --wait
          docker compose ps

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: 'package.json'

      - name: Test application
        run: |
          npm ci
          # apps/api and apps/worker import @workout-logging/shared as a
          # package (via its package.json "main": "dist/index.js"), not as
          # raw TS source — its compiled dist/ is gitignored (developer
          # machines already have it from a prior local build), so a fresh
          # CI checkout has to build it before anything can resolve the
          # import. Building it alone (not `--workspaces`) sidesteps plain
          # npm workspaces having no dependency-aware build ordering — a
          # blanket `build --workspaces` here failed apps/worker's build
          # because it ran before shared's.
          npm run build --workspace=@workout-logging/shared
          # `synchronize: false` (packages/shared/src/db/typeorm.ts) — the
          # Postgres schema only exists via real TypeORM migrations. Local
          # dev's Postgres volume already has them applied from way back;
          # CI's is a brand-new empty database every run, so this has to
          # run before any test touches Postgres. Idempotent — a no-op if
          # already applied.
          npm run migration:run --workspace=@workout-logging/shared
          # --if-present: apps/web has no "test" script yet — without this
          # flag, npm workspaces treats that as a hard failure for the
          # whole command instead of just skipping it.
          npm run test --workspaces --if-present
