# Datastore majors are pinned, and none of them is the newest release. That was
# never a decision — the four tags came in with the first commit and nothing has
# revisited them since. Recording it here so the next reader does not have to
# rediscover that there was no reason, and so a bump is planned rather than
# attempted as a one-line edit:
#
#   postgres  a major upgrade rewrites the on-disk catalog, so it needs
#             pg_dump/restore or pg_upgrade against the EBS data volume, not a
#             new tag. The riskiest of the four for data.
#   rabbitmq  4 changes defaults and retires mechanisms the TTL-based retry
#             tiers lean on (packages/shared/src/events/rabbitmq.ts). The
#             riskiest for behaviour: the failure would be a message quietly not
#             retried, which nothing here would notice.
#   mongo     supports upgrading one major at a time; straightforward.
#   redis     holds nothing worth keeping — the weekly-volume cache rebuilds
#             from Postgres on a miss and Pub/Sub is not persisted. Cheapest.
#
# Upgrading deserves its own spec with its own verification, not a side errand
# during feature work. Keep this file and infra/docker-compose.prod.yml on the
# same versions — a local/production split here would make every "works on my
# machine" report unanswerable.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workout_logging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workout_logging}
      POSTGRES_DB: ${POSTGRES_DB:-workout_logging}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-workout_logging}']
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-workout_logging}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-workout_logging}
    ports:
      - '${MONGO_PORT:-27017}:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-workout_logging}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-workout_logging}
    ports:
      - '${RABBITMQ_PORT:-5672}:5672'
      - '${RABBITMQ_MANAGEMENT_PORT:-15672}:15672' # management UI — used for the duplicate-delivery check in quickstart.md
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  mongo_data:
  rabbitmq_data:
